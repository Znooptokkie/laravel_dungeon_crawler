<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 14" width="400" height="280" shape-rendering="crispEdges">
  <title>Pixel art chest (wide)</title>
  <!-- Outline -->
  <g fill="#2b1a0e">
    <rect x="3" y="1" width="14" height="1"/>
    <rect x="2" y="2" width="1" height="10"/>
    <rect x="17" y="2" width="1" height="10"/>
    <rect x="2" y="12" width="16" height="1"/>
  </g>
  <!-- Lid -->
  <rect x="3" y="2" width="14" height="1" fill="#b57a3c"/>
  <rect x="3" y="3" width="14" height="2" fill="#8f5a2b"/>
  <!-- Metal seam -->
  <rect x="3" y="5" width="14" height="1" fill="#9aa0a6"/>
  <!-- Body -->
  <rect x="3" y="6" width="14" height="4" fill="#8f5a2b"/>
  <rect x="3" y="10" width="14" height="2" fill="#6b3f1d"/>
  <!-- Wood highlights -->
  <g fill="#b57a3c">
    <rect x="7" y="3" width="2" height="1"/>
    <rect x="12" y="3" width="1" height="1"/>
    <rect x="12" y="7" width="3" height="1"/>
    <rect x="7" y="8" width="2" height="1"/>
    <rect x="4" y="7" width="1" height="1"/>
  </g>
  <!-- Vertical metal bands -->
  <g fill="#9aa0a6">
    <rect x="5" y="2" width="1" height="10"/>
    <rect x="14" y="2" width="1" height="10"/>
  </g>
  <g fill="#d0d5da">
    <rect x="5" y="2" width="1" height="1"/>
    <rect x="14" y="2" width="1" height="1"/>
    <rect x="5" y="5" width="1" height="1"/>
    <rect x="14" y="5" width="1" height="1"/>
    <rect x="5" y="8" width="1" height="1"/>
    <rect x="14" y="8" width="1" height="1"/>
  </g>
  <!-- Gold lock -->
  <rect x="9" y="4" width="2" height="1" fill="#b8860b"/>
  <rect x="9" y="5" width="2" height="3" fill="#f2c230"/>
  <rect x="9" y="7" width="2" height="1" fill="#b8860b"/>
  <!-- Keyhole -->
  <rect x="10" y="6" width="1" height="1" fill="#2b1a0e"/>
  <!-- Shadow -->
  <rect x="3" y="13" width="14" height="1" fill="#000" opacity="0.25"/>
</svg>
